name: Copy LiDAR Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy-lidar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout new repository
        uses: actions/checkout@v4

      - name: Checkout original repository
  uses: actions/checkout@v4
  with:
    repository: ShivaliM11/Competition_RoboCar
    ref: 4954c614c461faea1c13eea868480575ab10db1b
    path: original_repo
    token: ${{ secrets.SOURCE_REPO_TOKEN }}

      - name: Copy lidar_trial
        run: |
          cp -R "original_repo/Lidar Working/lidar_trial/." .

          rm -f lidar1.c lidar3.c
          rm -f lidar1 lidar3
          rm -f lidar1.o lidar3.o

      - name: Commit files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Add LiDAR detection project"
          git push
